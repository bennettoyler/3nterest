name: Interest
options:
  bundleIdPrefix: com.interest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.2
targets:
  Interest:
    type: application
    platform: iOS
    sources:
      - Interest
    dependencies:
      - package: ConvexMobile
    info:
      path: Interest/App/Info.plist
      properties:
        CFBundleDisplayName: 3nterest
        NSCameraUsageDescription: 3nterest uses the camera and LiDAR to scan your room.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.interest.app
            CFBundleURLSchemes:
              - interest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interest.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  InterestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InterestTests
    dependencies:
      - target: Interest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interest.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Interest:
    build:
      targets:
        Interest: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InterestTests
